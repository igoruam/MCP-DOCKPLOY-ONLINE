# Deploy on Dokploy as a "Compose" service. Attach a Domain (e.g. mcp.example.com) to the
# `dokploy-mcp` service, container port 3000, HTTPS (Let's Encrypt).
#
# Required environment (Dokploy → service → Environment):
#   MCP_SECRET=<openssl rand -hex 32>          encrypts the OAuth tokens (keep it stable!)
#   PUBLIC_URL=https://mcp.example.com         the public URL of this server (no trailing slash)
# Do NOT set DOKPLOY_URL / DOKPLOY_API_KEY: every user brings their own.
services:
  dokploy-mcp:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - MCP_TRANSPORT=http
      - PORT=3000
      - MCP_SECRET=${MCP_SECRET:?set MCP_SECRET (openssl rand -hex 32)}
      - PUBLIC_URL=${PUBLIC_URL:?set PUBLIC_URL (https://mcp.example.com)}
      # Optional hardening / tuning
      - DOKPLOY_ALLOWED_HOSTS=${DOKPLOY_ALLOWED_HOSTS:-}
      - DOKPLOY_TOOL_PRESET=${DOKPLOY_TOOL_PRESET:-all}
      - OAUTH_ALLOWED_REDIRECT_HOSTS=${OAUTH_ALLOWED_REDIRECT_HOSTS:-}
